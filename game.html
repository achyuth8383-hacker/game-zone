<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Rush</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #10142b, #24205c);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-bottom: 6px;
      font-size: 28px;
    }
    .sub {
      opacity: 0.75;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
    }
    .stat b {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }
    #arena {
      height: 320px;
      background: #0b0f20;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #target {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: none;
      cursor: pointer;
      background: radial-gradient(circle, #00f2fe, #4facfe);
      box-shadow: 0 0 18px #00f2fe;
      user-select: none;
      -webkit-user-select: none;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #4facfe;
      color: #fff;
      width: 100%;
      margin-top: 14px;
    }
    button:active {
      transform: scale(0.98);
    }
    #message {
      margin-top: 12px;
      min-height: 22px;
      font-size: 15px;
    }
    .back-btn {
      display: inline-block;
      margin-top: 16px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎯 Target Rush</h1>
    <p class="sub">Tap the glowing target as many times as you can!</p>

    <div class="stats">
      <div class="stat">Score<b id="score">0</b></div>
      <div class="stat">Time<b id="time">20</b></div>
      <div class="stat">Best<b id="best">0</b></div>
    </div>

    <div id="arena">
      <div id="target" aria-label="target"></div>
    </div>

    <button id="start">START GAME</button>
    <div id="message">Ready?</div>
    <a class="back-btn" href="index.html">← Back to Menu</a>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const target = document.getElementById('target');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('start');
    const message = document.getElementById('message');

    let score = 0;
    let time = 20;
    let running = false;
    let timer = null;

    let best = Number(localStorage.getItem('targetRushBest') || 0);
    bestEl.textContent = best;

    function moveTarget() {
      const size = 54;
      const maxX = arena.clientWidth - size;
      const maxY = arena.clientHeight - size;
      const x = Math.max(0, Math.floor(Math.random() * maxX));
      const y = Math.max(0, Math.floor(Math.random() * maxY));
      target.style.left = x + 'px';
      target.style.top = y + 'px';
      target.style.display = 'block';
    }

    function startGame() {
      clearInterval(timer);
      score = 0;
      time = 20;
      running = true;
      scoreEl.textContent = score;
      timeEl.textContent = time;
      message.textContent = 'Go! ⚡';
      startBtn.textContent = 'RESTART';
      moveTarget();

      timer = setInterval(() => {
        time--;
        timeEl.textContent = time;
        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      running = false;
      target.style.display = 'none';

      if (score > best) {
        best = score;
        localStorage.setItem('targetRushBest', best);
        bestEl.textContent = best;
        message.textContent = `🏆 New high score: ${score}!`;
      } else {
        message.textContent = `Time's up! You scored ${score}.`;
      }
    }

    target.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!running) return;
      score++;
      scoreEl.textContent = score;
      moveTarget();
    });

    startBtn.addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      if (running) moveTarget();
    });
  </script>
</body>
</html>
