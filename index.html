<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>game-zone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 36px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
      font-size: 16px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      max-width: 700px;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      flex: 1 1 280px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .card h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .card p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      font-size: 16px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover {
      background: #0ea5e9;
      color: #ffffff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>🎮 game-zone</h1>
  <p class="subtitle">Choose a game to play:</p>

  <div class="grid">
    <!-- Game 1 Card -->
    <div class="card">
      <div>
        <h2>🎯 Target Rush</h2>
        <p>Tap glowing targets as fast as you can before the 20-second timer runs out!</p>
      </div>
      <a class="btn" href="game.html">Play Now</a>
    </div>

    <!-- Game 2 Card -->
    <div class="card">
      <div>
        <h2>🏃 Pixel Runner</h2>
        <p>Jump over moving obstacles and see how far you can run without crashing!</p>
      </div>
      <a class="btn" href="runner.html">Play Now</a>
    </div>
  </div>

</body>
</html>
