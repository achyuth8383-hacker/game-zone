<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Target Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#10142b,#24205c);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(520px,100%);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0 0 6px;font-size:32px}.sub{opacity:.75;margin:0 0 18px}
.stats{display:flex;gap:10px;margin-bottom:14px}.stat{flex:1;background:rgba(0,0,0,.2);padding:12px;border-radius:14px;text-align:center}.stat b{display:block;font-size:24px}
#arena{height:360px;background:#0b0f20;border-radius:18px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
#target{position:absolute;width:58px;height:58px;border-radius:50%;display:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#7cf 12%,#46f 45%,#9d35ff 100%);box-shadow:0 0 25px #55aaff}
button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;width:100%;background:white;color:#151833}
button:active{transform:scale(.98)}
#message{text-align:center;margin-top:12px;min-height:24px}
.small{font-size:13px;opacity:.65;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>🎯 QR Target Rush</h1>
  <p class="sub">Tap the glowing target as many times as you can!</p>

  <div class="stats">
    <div class="stat">Score<b id="score">0</b></div>
    <div class="stat">Time<b id="time">20</b></div>
    <div class="stat">Best<b id="best">0</b></div>
  </div>

  <div id="arena">
    <div id="target" aria-label="target"></div>
  </div>

  <button id="start">START GAME</button>
  <div id="message">Ready?</div>
  <div class="small">Made for a QR-code mini game 🚀</div>
</div>

<script>
const arena=document.getElementById('arena');
const target=document.getElementById('target');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const bestEl=document.getElementById('best');
const startBtn=document.getElementById('start');
const message=document.getElementById('message');

let score=0,time=20,running=false,timer;
let best=Number(localStorage.getItem('qrTargetBest')||0);
bestEl.textContent=best;

function moveTarget(){
  const size=58;
  const x=Math.random()*(arena.clientWidth-size);
  const y=Math.random()*(arena.clientHeight-size);
  target.style.left=x+'px';
  target.style.top=y+'px';
  target.style.display='block';
}
function startGame(){
  clearInterval(timer);
  score=0; time=20; running=true;
  scoreEl.textContent=score; timeEl.textContent=time;
  message.textContent='Go! ⚡';
  startBtn.textContent='RESTART';
  moveTarget();
  timer=setInterval(()=>{
    time--;
    timeEl.textContent=time;
    if(time<=0) endGame();
  },1000);
}
function endGame(){
  clearInterval(timer); running=false; target.style.display='none';
  if(score>best){
    best=score;
    localStorage.setItem('qrTargetBest',best);
    bestEl.textContent=best;
    message.textContent=`🏆 New best score: ${score}!`;
  }else{
    message.textContent=`⏰ Time's up! You scored ${score}.`;
  }
}
target.addEventListener('pointerdown',()=>{
  if(!running)return;
  score++;
  scoreEl.textContent=score;
  moveTarget();
});
startBtn.addEventListener('click',startGame);
window.addEventListener('resize',()=>{if(running)moveTarget()});
</script>
</body>
</html>
