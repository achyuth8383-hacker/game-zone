<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pro Cricket Championship - Full Stadium</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #050811;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #gameStage {
      position: relative;
      width: min(100vw, 440px);
      height: min(100vh, 720px);
      background: #020617;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      border: 2px solid #1e293b;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Scoreboard HUD */
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 30;
    }
    .scorecard {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
    }
    .scorecard b {
      font-size: 20px;
      color: #38bdf8;
      display: block;
      margin: 2px 0;
    }
    .back-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    /* Action Commentary Banner */
    #commentary {
      position: absolute;
      top: 78px;
      width: 100%;
      text-align: center;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
      pointer-events: none;
      z-index: 30;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cheer { color: #facc15; transform: scale(1.2); }
    .groan { color: #ef4444; transform: scale(1.15); }

    /* Batting Controls */
    .controls-panel {
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
    }
    .shot-selectors {
      display: flex;
      gap: 6px;
    }
    .shot-btn {
      flex: 1;
      padding: 10px 4px;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid #475569;
      color: #cbd5e1;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .shot-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .hit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      cursor: pointer;
    }
    .hit-btn:active { transform: scale(0.97); }

    /* Modal / Popups */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .modal h2 { font-size: 24px; margin-bottom: 6px; }
    .modal p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    
    .over-picker {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .over-btn {
      flex: 1;
      padding: 12px 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .over-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .action-btn {
      width: 100%;
      padding: 14px 20px;
      background: #38bdf8;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      font-size: 16px;
      color: #0f172a;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="gameStage">
    <canvas id="cricCanvas" width="440" height="720"></canvas>

    <div class="hud">
      <div class="scorecard">
        <span id="currentTeam">IND BATTING</span>
        <b id="scoreBoard">0/0 (0.0)</b>
        <span id="targetBoard" style="color:#facc15; font-size:11px;">Target: ---</span>
      </div>
      <a class="back-btn" href="index.html">← Menu</a>
    </div>

    <div id="commentary">SELECT MATCH LENGTH TO BEGIN</div>

    <div class="controls-panel">
      <div class="shot-selectors">
        <button class="shot-btn" id="shotOff" onclick="setShot('OFF')">OFF DRIVE</button>
        <button class="shot-btn active" id="shotStraight" onclick="setShot('STRAIGHT')">STRAIGHT</button>
        <button class="shot-btn" id="shotLeg" onclick="setShot('LEG')">LEG PULL</button>
      </div>
      <button class="hit-btn" id="swingBatBtn">🏏 SWING BAT</button>
    </div>

    <!-- Match Configuration & Results Modal -->
    <div class="modal" id="overlay">
      <h2 id="modalTitle">🏟️ STADIUM CHAMPIONSHIP</h2>
      <p id="modalDesc">Choose over duration. Face the bowler, hit boundaries, and watch out for fielding catches!</p>
      
      <div class="over-picker" id="overPickerSection">
        <button class="over-btn active" id="btn3ov" onclick="pickOvers(3)">3 Overs<br><small style="color:#94a3b8;">(2 Wkts)</small></button>
        <button class="over-btn" id="btn5ov" onclick="pickOvers(5)">5 Overs<br><small style="color:#94a3b8;">(3 Wkts)</small></button>
        <button class="over-btn" id="btn10ov" onclick="pickOvers(10)">10 Overs<br><small style="color:#94a3b8;">(5 Wkts)</small></button>
      </div>

      <button class="action-btn" id="modalBtn" onclick="startInnings()">TOSS & PLAY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("cricCanvas");
    const ctx = canvas.getContext("2d");
    const commentary = document.getElementById("commentary");
    const scoreBoard = document.getElementById("scoreBoard");
    const currentTeamEl = document.getElementById("currentTeam");
    const targetBoard = document.getElementById("targetBoard");
    const overlay = document.getElementById("overlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const modalBtn = document.getElementById("modalBtn");
    const swingBatBtn = document.getElementById("swingBatBtn");
    const overPickerSection = document.getElementById("overPickerSection");

    // Audio Synthesizers
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCrowdCheer() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2.2, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 850;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.2);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();
    }

    function playCrowdGroan() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(65, audioCtx.currentTime + 1.4);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.4);
    }

    function playBatCrack() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(540, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // Match State Variables
    let selectedOvers = 3;
    let maxBalls = 18;
    let maxWickets = 2; // Min 2 for 3 overs
    let innings = 1;
    let runsTeam1 = 0, wicketsTeam1 = 0;
    let runsTeam2 = 0, wicketsTeam2 = 0;
    let ballsDelivered = 0;
    let currentShot = "STRAIGHT";
    let isBallActive = false;

    // Fielders positioning (Ring & Deep)
    const initialFielders = [
      { id: 1, baseRelX: 100, baseRelY: 340, x: 100, y: 340, role: 'Point' },
      { id: 2, baseRelX: 140, baseRelY: 260, x: 140, y: 260, role: 'Cover' },
      { id: 3, baseRelX: 290, baseRelY: 260, x: 290, y: 260, role: 'Mid-Wicket' },
      { id: 4, baseRelX: 330, baseRelY: 340, x: 330, y: 340, role: 'Square Leg' },
      { id: 5, baseRelX: 220, baseRelY: 210, x: 220, y: 210, role: 'Long On' }
    ];
    let fielders = JSON.parse(JSON.stringify(initialFielders));

    // Player Models State
    let bowler = { x: 210, y: 155, running: false, runFrame: 0, armAngle: 0, released: false };
    let batsman = { x: 245, y: 535, swinging: false, swingFrame: 0, batAngle: 0 };
    let ball = { x: 220, y: 210, z: 0, radius: 4, active: false, hit: false, hitDx: 0, hitDy: 0, loft: 0 };

    function pickOvers(ov) {
      selectedOvers = ov;
      maxBalls = ov * 6;
      maxWickets = ov === 3 ? 2 : (ov === 5 ? 3 : 5);

      document.querySelectorAll('.over-btn').forEach(b => b.classList.remove('active'));
      if (ov === 3) document.getElementById('btn3ov').classList.add('active');
      if (ov === 5) document.getElementById('btn5ov').classList.add('active');
      if (ov === 10) document.getElementById('btn10ov').classList.add('active');
    }

    function setShot(shot) {
      currentShot = shot;
      document.querySelectorAll('.shot-btn').forEach(b => b.classList.remove('active'));
      if (shot === 'OFF') document.getElementById('shotOff').classList.add('active');
      if (shot === 'STRAIGHT') document.getElementById('shotStraight').classList.add('active');
      if (shot === 'LEG') document.getElementById('shotLeg').classList.add('active');
    }

    function startInnings() {
      overlay.style.display = "none";
      overPickerSection.style.display = "none";

      if (innings === 1) {
        runsTeam1 = 0; wicketsTeam1 = 0; ballsDelivered = 0;
        currentTeamEl.innerText = "IND BATTING (1st INNINGS)";
        targetBoard.innerText = `Setting Target (${selectedOvers} Ov, ${maxWickets} Wkts)`;
      } else {
        ballsDelivered = 0;
        currentTeamEl.innerText = "AUS BATTING (CHASING)";
        targetBoard.innerText = `Target: Need ${runsTeam1 + 1} from ${maxBalls} balls`;
      }
      updateScoreboard();
      setTimeout(startBowlerRunup, 900);
    }

    function updateScoreboard() {
      const runs = innings === 1 ? runsTeam1 : runsTeam2;
      const wickets = innings === 1 ? wicketsTeam1 : wicketsTeam2;
      const overs = Math.floor(ballsDelivered / 6) + "." + (ballsDelivered % 6);
      scoreBoard.innerText = `${runs}/${wickets} (${overs} / ${selectedOvers})`;
    }

    function resetFielders() {
      fielders = JSON.parse(JSON.stringify(initialFielders));
    }

    // Bowler Run-up
    function startBowlerRunup() {
      const currWickets = innings === 1 ? wicketsTeam1 : wicketsTeam2;
      if (ballsDelivered >= maxBalls || currWickets >= maxWickets || (innings === 2 && runsTeam2 > runsTeam1)) {
        endInnings();
        return;
      }

      resetFielders();
      bowler.x = 205;
      bowler.y = 150;
      bowler.running = true;
      bowler.runFrame = 0;
      bowler.armAngle = 0;
      bowler.released = false;
      commentary.className = "";
      commentary.innerText = "Bowler strides in from pavilion...";

      let runInterval = setInterval(() => {
        bowler.y += 1.8;
        bowler.runFrame += 0.3;
        bowler.armAngle += 0.22;

        if (bowler.y >= 195 && !bowler.released) {
          bowler.released = true;
          bowler.running = false;
          clearInterval(runInterval);
          deliverBall();
        }
      }, 30);
    }

    function deliverBall() {
      ball.x = 220 + (Math.random() * 14 - 7);
      ball.y = 205;
      ball.z = 0;
      ball.radius = 4;
      ball.active = true;
      ball.hit = false;
      ball.loft = 0;
      isBallActive = true;
      commentary.innerText = "Here comes the delivery...";
    }

    // Bat Stroke & Catch Mechanics
    function swingBat() {
      batsman.swinging = true;
      batsman.swingFrame = 0;

      if (!isBallActive || !ball.active || ball.hit) return;

      if (ball.z >= 0.68 && ball.z <= 0.90) {
        ball.hit = true;
        playBatCrack();
        let timing = Math.abs(ball.z - 0.79);
        let runsScored = 0;

        // Determine Loft & Trajectory
        if (timing < 0.035) {
          // Perfect 6
          runsScored = 6;
          ball.hitDy = -9;
          ball.loft = 1;
          commentary.innerText = "💥 MAXIMUM! MASSIVE 6 INTO THE CROWD!";
          commentary.className = "cheer";
          playCrowdCheer();
          resolveShot(runsScored);
        } else if (timing < 0.07) {
          // 4 Runs along the ground
          runsScored = 4;
          ball.hitDy = -7;
          ball.loft = 0;
          commentary.innerText = "🔥 CRACKING TIMING! RACING TO THE 4!";
          commentary.className = "cheer";
          playCrowdCheer();
          resolveShot(runsScored);
        } else {
          // Mis-timed shot: High chance of fielder catch
          ball.hitDy = -4.5;
          ball.loft = 0.5;

          if (currentShot === 'OFF') ball.hitDx = -4;
          else if (currentShot === 'LEG') ball.hitDx = 4;
          else ball.hitDx = (Math.random() - 0.5) * 3;

          checkFielderCatch();
          return;
        }

        if (currentShot === 'OFF') ball.hitDx = -5;
        else if (currentShot === 'LEG') ball.hitDx = 5;
        else ball.hitDx = (Math.random() - 0.5) * 2.5;

      } else if (ball.z > 0.90) {
        recordWicket("CLEAN BOWLED! 🚫 CRASHES INTO STUMPS!");
      } else {
        commentary.innerText = "Early swing! Beaten completely by pace!";
      }
    }

    function checkFielderCatch() {
      // Find closest fielder to anticipated intercept point
      const interceptX = ball.x + (ball.hitDx * 20);
      const interceptY = ball.y + (ball.hitDy * 20);

      let closest = fielders[0];
      let minD = 9999;
      fielders.forEach(f => {
        let dist = Math.hypot(f.x - interceptX, f.y - interceptY);
        if (dist < minD) { minD = dist; closest = f; }
      });

      // Animate fielder tracking ball
      let catchChance = 0.65; // 65% chance of catch on mis-timed air balls
      let trackingTimer = setInterval(() => {
        closest.x += (interceptX - closest.x) * 0.15;
        closest.y += (interceptY - closest.y) * 0.15;
      }, 40);

      setTimeout(() => {
        clearInterval(trackingTimer);
        if (Math.random() < catchChance) {
          recordWicket(`OUT! 🧤 CAUGHT by ${closest.role}!`);
        } else {
          let runs = Math.random() > 0.5 ? 2 : 1;
          commentary.innerText = `Fielder dives! Misfielded for ${runs} run(s)`;
          resolveShot(runs);
        }
      }, 700);
    }

    function resolveShot(runs) {
      if (innings === 1) runsTeam1 += runs;
      else runsTeam2 += runs;
      concludeDelivery();
    }

    function recordWicket(msg) {
      ball.active = false;
      ball.hit = false;
      playCrowdGroan();
      commentary.innerText = msg;
      commentary.className = "groan";

      if (innings === 1) wicketsTeam1++;
      else wicketsTeam2++;
      concludeDelivery();
    }

    function concludeDelivery() {
      isBallActive = false;
      ballsDelivered++;
      updateScoreboard();

      const currWickets = innings === 1 ? wicketsTeam1 : wicketsTeam2;

      if (innings === 2 && runsTeam2 > runsTeam1) {
        setTimeout(endInnings, 1200);
        return;
      }

      if (ballsDelivered >= maxBalls || currWickets >= maxWickets) {
        setTimeout(endInnings, 1500);
      } else {
        setTimeout(startBowlerRunup, 1800);
      }
    }

    function endInnings() {
      if (innings === 1) {
        innings = 2;
        modalTitle.innerText = "INNINGS BREAK";
        modalDesc.innerText = `Team India finished on ${runsTeam1}/${wicketsTeam1} in ${selectedOvers} overs.\nAustralia needs ${runsTeam1 + 1} runs to win with ${maxWickets} wickets in hand!`;
        modalBtn.innerText = "DEFEND TARGET (2nd INNINGS)";
        overlay.style.display = "flex";
      } else {
        overlay.style.display = "flex";
        overPickerSection.style.display = "flex";
        if (runsTeam1 > runsTeam2) {
          modalTitle.innerText = "🏆 TEAM INDIA WINS!";
          modalDesc.innerText = `India: ${runsTeam1}/${wicketsTeam1}\nAustralia: ${runsTeam2}/${wicketsTeam2}\nIndia clinched victory by ${runsTeam1 - runsTeam2} runs!`;
        } else if (runsTeam2 > runsTeam1) {
          modalTitle.innerText = "🏆 TEAM AUSTRALIA WINS!";
          modalDesc.innerText = `Australia: ${runsTeam2}/${wicketsTeam2}\nIndia: ${runsTeam1}/${wicketsTeam1}\nAustralia chased it down with ${maxWickets - wicketsTeam2} wickets remaining!`;
        } else {
          modalTitle.innerText = "🤝 HISTORIC TIE!";
          modalDesc.innerText = `Scores level at ${runsTeam1} runs each!`;
        }
        modalBtn.innerText = "SETUP NEW MATCH";
        innings = 1;
      }
    }

    // --- DRAWING STADIUM & CHARACTERS ---

    function drawHumanBowler(x, y) {
      ctx.save();
      ctx.translate(x, y);
      const jersey = innings === 1 ? "#facc15" : "#0284c7";

      // Head & Cap
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(0, -18, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = jersey;
      ctx.fillRect(-5, -23, 10, 4);

      // Torso
      ctx.fillStyle = jersey;
      ctx.fillRect(-6, -13, 12, 14);

      // Running Legs
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      const stride = Math.sin(bowler.runFrame * 3) * 6;
      ctx.beginPath();
      ctx.moveTo(-3, 1);
      ctx.lineTo(-4 + stride, 14);
      ctx.moveTo(3, 1);
      ctx.lineTo(4 - stride, 14);
      ctx.stroke();

      // Bowling Arm
      ctx.strokeStyle = "#fed7aa";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(5, -10);
      ctx.lineTo(5 + Math.cos(bowler.armAngle) * 10, -10 + Math.sin(bowler.armAngle) * 10);
      ctx.stroke();
      ctx.restore();
    }

    function drawHumanFielder(f)
